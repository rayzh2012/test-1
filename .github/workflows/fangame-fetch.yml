name: Fangame Fetch

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and verify fangame archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          python3 - <<'PY'
          import os,re,hashlib,requests,sys
          from urllib.parse import urljoin

          candidates=[
            'https://www.mediafire.com/?jatw51syt19ggzw',
            'https://www.mediafire.com/file/jatw51syt19ggzw/'
          ]
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          found=[]
          for u in candidates:
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              print('LANDING',u,r.status_code,r.url,r.headers.get('content-type'),len(r.content))
              if 'text/html' in (r.headers.get('content-type') or ''):
                text=r.text
                pats=[
                  r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
                  r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']',
                  r'href=["\'](https?://download[^"\']+mediafire\.com/[^"\']+)["\']',
                  r'href=["\'](https?://[^"\']*mediafireusercontent\.com/[^"\']+)["\']'
                ]
                for p in pats:
                  for m in re.findall(p,text,re.I):
                    found.append(urljoin(r.url,m.replace('&amp;','&')))
              else:
                found.append(r.url)
            except Exception as e:
              print('LANDING_ERR',u,repr(e))
          print('CANDIDATE_DIRECT',found)
          seen=set()
          for du in found:
            if du in seen: continue
            seen.add(du)
            try:
              with s.get(du,timeout=45,allow_redirects=True,stream=True) as r:
                print('DIRECT',du,r.status_code,r.url,r.headers.get('content-type'),r.headers.get('content-length'))
                if r.status_code!=200: continue
                cd=r.headers.get('content-disposition') or ''
                name='magic_baby_memorial_2012.bin'
                m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)',cd,re.I)
                if m:
                  name=m.group(1)
                path=os.path.join('out',name)
                h=hashlib.sha256(); n=0; head=b''
                with open(path,'wb') as f:
                  for chunk in r.iter_content(1024*1024):
                    if not chunk: continue
                    if n<32: head += chunk[:32-len(head)]
                    f.write(chunk); h.update(chunk); n += len(chunk)
                print('SAVED',path,n,'SHA256',h.hexdigest(),'HEAD',head.hex())
                if n < 50*1024*1024:
                  print('TOO_SMALL'); os.remove(path); continue
                open('out/SHA256.txt','w').write(f'{h.hexdigest()}  {os.path.basename(path)}\n')
                sys.exit(0)
            except Exception as e:
              print('DIRECT_ERR',du,repr(e))
          raise SystemExit('No valid >=50MB archive fetched')
          PY
      - name: List output
        if: always()
        run: ls -lah out || true
      - name: Upload archive artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: magic-baby-memorial-2012
          path: out/*
          retention-days: 3
