        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part009', path: 'driveparts/*.009', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 010
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.010') != ''
        uses: actions/upload-artifact@v4
