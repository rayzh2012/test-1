      - name: Upload Drive part 014
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.014') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part014', path: 'driveparts/*.014', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 015
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.015') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part015', path: 'driveparts/*.015', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 016
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.016') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part016', path: 'driveparts/*.016', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 017
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.017') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part017', path: 'driveparts/*.017', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 018
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.018') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part018', path: 'driveparts/*.018', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 019
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.019') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part019', path: 'driveparts/*.019', retention-days: 7, compression-level: 0}
      - name: Upload Drive metadata
        if: steps.fetch.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fetch.outputs.base }}-metadata
          path: |
            driveparts/SHA256.txt
            driveparts/fetch_report.json
            driveparts/playability_static.json
            driveparts/rpgmaker_graph.json
            driveparts/playability_smoke.json
            driveparts/fangame_review_card.json
            driveparts/fangame_review_card.md
          if-no-files-found: warn
          retention-days: 7
      - name: Upload failure report
        if: steps.fetch.outputs.rc != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fetch.outputs.base }}-failed
          path: out/fetch_report.json
          retention-days: 7
