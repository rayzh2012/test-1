name: Fangame Fetch

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'fangame_targets/**.json'
      - 'tools/fangame_fetcher.py'
      - 'tools/fangame_inspect.py'
      - 'tools/fangame_smoke.py'
      - 'tools/fangame_review_card.py'
      - 'tools/rpgmaker_marshal_probe.rb'
      - 'tools/rpgmaker_graph_probe.rb'
      - '.github/workflows/fangame-fetch.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: targets
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob,json,os,subprocess
          event=os.environ.get('GITHUB_EVENT_NAME','')
          if event=='pull_request':
              base=os.environ.get('GITHUB_BASE_REF','master')
              p=subprocess.run(['git','diff','--name-only',f'origin/{base}...HEAD','--','fangame_targets/*.json'],capture_output=True,text=True)
              files=[x.strip() for x in p.stdout.splitlines() if x.strip().endswith('.json') and os.path.exists(x.strip())]
          else:
              files=glob.glob('fangame_targets/*.json')
          print('targets='+json.dumps(files,ensure_ascii=False))
          PY

  fetch:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch target
        id: fetch
        shell: bash
        run: |
          set +e
          base=$(basename '${{ matrix.target }}' .json)
          rm -rf out driveparts playability_work && mkdir -p out
          python3 tools/fangame_fetcher.py '${{ matrix.target }}' -o out
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install playability probe dependencies
        if: steps.fetch.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools xvfb xdotool scrot imagemagick fonts-noto-cjk locales pulseaudio pulseaudio-utils
          sudo locale-gen zh_CN.UTF-8 || true
          sudo apt-get install -y wine wine64 || true
          sudo apt-get install -y easyrpg-player || true
          sudo apt-get install -y mkxp || true
          command -v 7z || true
          command -v unar || true
          command -v bsdtar || true
          command -v wine || true
          command -v easyrpg-player || true
          command -v mkxp || true

      - name: Static engine, content and graph probe
        if: steps.fetch.outputs.rc == '0'
        id: inspect
        continue-on-error: true
        shell: bash
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: |
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('out/fetch_report.json'))['file'])
          PY
          )
          python3 tools/fangame_inspect.py "out/$game" --workdir playability_work --out out/playability_static.json --graph-out out/rpgmaker_graph.json

      - name: CI boot and input smoke test
        if: steps.fetch.outputs.rc == '0' && hashFiles('out/playability_static.json') != ''
        continue-on-error: true
        shell: bash
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: |
          python3 tools/fangame_smoke.py --static out/playability_static.json --extract-root playability_work/extract --outdir out/playability_smoke

      - name: Upload playability evidence
        if: steps.fetch.outputs.rc == '0' && hashFiles('out/playability_static.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fetch.outputs.base }}-playability
          path: |
            out/playability_static.json
            out/rpgmaker_graph.json
            out/playability_smoke/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Split large archives for Drive connector
        if: steps.fetch.outputs.rc == '0'
        shell: bash
        run: |
          mkdir -p driveparts
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('out/fetch_report.json'))['file'])
          PY
          )
          split -b 75M -d -a 3 "out/$game" "driveparts/$(basename "$game")."
          cp out/SHA256.txt out/fetch_report.json driveparts/
          [ -f out/playability_static.json ] && cp out/playability_static.json driveparts/ || true
          [ -f out/rpgmaker_graph.json ] && cp out/rpgmaker_graph.json driveparts/ || true
          [ -f out/playability_smoke/playability_smoke.json ] && cp out/playability_smoke/playability_smoke.json driveparts/ || true
          [ -f out/playability_smoke/fangame_review_card.json ] && cp out/playability_smoke/fangame_review_card.json driveparts/ || true
          [ -f out/playability_smoke/fangame_review_card.md ] && cp out/playability_smoke/fangame_review_card.md driveparts/ || true

      - name: Upload full result
        if: steps.fetch.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fetch.outputs.base }}-full
          path: out/*
          retention-days: 7
          compression-level: 0

      - name: Upload Drive part 000
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.000') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part000', path: 'driveparts/*.000', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 001
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.001') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part001', path: 'driveparts/*.001', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 002
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.002') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part002', path: 'driveparts/*.002', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 003
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.003') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part003', path: 'driveparts/*.003', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 004
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.004') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part004', path: 'driveparts/*.004', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 005
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.005') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part005', path: 'driveparts/*.005', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 006
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.006') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part006', path: 'driveparts/*.006', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 007
        if: steps.fetch.outputs.rc == '0' && hashFiles('driveparts/*.007') != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.fetch.outputs.base }}-part007', path: 'driveparts/*.007', retention-days: 7, compression-level: 0}
      - name: Upload Drive part 008
