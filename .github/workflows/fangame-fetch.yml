name: Fangame Fetch

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'fangame_targets/final_redemption_mv.json'
      - 'tools/fangame_fetcher.py'
      - '.github/workflows/fangame-fetch.yml'

jobs:
  fetch-final-redemption-drive-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Fetch exact public package
        run: |
          set -euo pipefail
          rm -rf out driveparts
          mkdir -p out driveparts
          python3 tools/fangame_fetcher.py fangame_targets/final_redemption_mv.json -o out

      - name: Verify exact identity and split losslessly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, hashlib
          r=json.load(open('out/fetch_report.json',encoding='utf-8'))
          expected_bytes=1005262766
          expected_sha='1c51f198f51a1fb704f645d734f86b0a1807e00c2572e66c30a9781bf82875bc'
          assert r.get('success') is True
          assert r.get('bytes') == expected_bytes, r
          assert r.get('sha256','').lower() == expected_sha, r
          p=pathlib.Path('out')/r['file']
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
          assert p.stat().st_size == expected_bytes
          assert h.hexdigest() == expected_sha
          print('PACKAGE_IDENTITY_VERIFIED', expected_bytes, expected_sha)
          PY
          split -b 75M -d -a 3 "out/Final Redemption.zip" "driveparts/Final Redemption.zip."
          python3 - <<'PY'
          import pathlib, hashlib, json
          ps=[]
          for p in sorted(pathlib.Path('driveparts').glob('Final Redemption.zip.*')):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
              ps.append({'name':p.name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          m={'schema':'fangame.driveparts.v1','game':'Final Redemption','version':'2026-08-16 current itch build','itch_upload_id':'18933248','source':'https://infiniv.itch.io/final-redemption','original_filename':'Final Redemption.zip','original_bytes':1005262766,'original_sha256':'1c51f198f51a1fb704f645d734f86b0a1807e00c2572e66c30a9781bf82875bc','prior_identity':{'itch_upload_id':'18916666','bytes':1005259975,'sha256':'692ce84549b838c095c0f777b6085f2d9eeabdfe3a73c40431c061f8c8d68c3b'},'split_size':'75 MiB','part_count':len(ps),'parts':ps,'reconstruct':'cat "Final Redemption.zip."??? > "Final Redemption.zip"'}
          assert len(ps)==13, len(ps)
          pathlib.Path('driveparts/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(m,indent=2))
          PY
          cat driveparts/'Final Redemption.zip.'??? | sha256sum | tee driveparts/reconstructed_sha256.txt
          grep -q '^1c51f198f51a1fb704f645d734f86b0a1807e00c2572e66c30a9781bf82875bc ' driveparts/reconstructed_sha256.txt

      - name: Upload part 000
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part000, path: 'driveparts/*.000', retention-days: 2, compression-level: 0}
      - name: Upload part 001
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part001, path: 'driveparts/*.001', retention-days: 2, compression-level: 0}
      - name: Upload part 002
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part002, path: 'driveparts/*.002', retention-days: 2, compression-level: 0}
      - name: Upload part 003
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part003, path: 'driveparts/*.003', retention-days: 2, compression-level: 0}
      - name: Upload part 004
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part004, path: 'driveparts/*.004', retention-days: 2, compression-level: 0}
      - name: Upload part 005
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part005, path: 'driveparts/*.005', retention-days: 2, compression-level: 0}
      - name: Upload part 006
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part006, path: 'driveparts/*.006', retention-days: 2, compression-level: 0}
      - name: Upload part 007
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part007, path: 'driveparts/*.007', retention-days: 2, compression-level: 0}
      - name: Upload part 008
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part008, path: 'driveparts/*.008', retention-days: 2, compression-level: 0}
      - name: Upload part 009
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part009, path: 'driveparts/*.009', retention-days: 2, compression-level: 0}
      - name: Upload part 010
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part010, path: 'driveparts/*.010', retention-days: 2, compression-level: 0}
      - name: Upload part 011
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part011, path: 'driveparts/*.011', retention-days: 2, compression-level: 0}
      - name: Upload part 012
        uses: actions/upload-artifact@v4
        with: {name: final-redemption-part012, path: 'driveparts/*.012', retention-days: 2, compression-level: 0}
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: final-redemption-drive-metadata
          path: |
            out/fetch_report.json
            out/SHA256.txt
            driveparts/manifest.json
            driveparts/reconstructed_sha256.txt
          retention-days: 2
          compression-level: 0
