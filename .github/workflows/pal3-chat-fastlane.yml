name: PAL3 Chat Fast Lane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "projects/pal3-unity/patches/**"
      - "projects/pal3-unity/commands/**"
      - "projects/pal3-unity/realtime-control.json"
      - "projects/pal3-unity/fast-tests.json"
      - "tools/source_rewrite_controller.py"
      - "tools/pal3_fastlane.py"
      - ".github/workflows/pal3-chat-fastlane.yml"
  push:
    paths:
      - "projects/pal3-unity/patches/**"
      - "projects/pal3-unity/commands/**"
      - "projects/pal3-unity/realtime-control.json"
      - "projects/pal3-unity/fast-tests.json"
      - "tools/source_rewrite_controller.py"
      - "tools/pal3_fastlane.py"
      - ".github/workflows/pal3-chat-fastlane.yml"

permissions:
  contents: read

jobs:
  fastlane:
    name: Replay PAL3 patches and run fast domain gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v6.0.3

      - name: Read PAL3 target
        id: target
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg = json.load(open("projects/pal3-unity/control.json", encoding="utf-8"))
          print(f"repo={cfg['upstream_repository']}")
          print(f"ref={cfg['upstream_ref']}")
          PY

      - name: Checkout pinned PAL3 upstream without LFS
        uses: actions/checkout@v6.0.3
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: .control/upstream
          fetch-depth: 1
          lfs: false

      - name: Replay patch stack and audit source
        run: |
          python tools/source_rewrite_controller.py audit \
            --config projects/pal3-unity/control.json \
            --workspace .control/upstream \
            --out out/pal3-unity

      - name: Run Unity-independent fast test slices
        run: |
          python tools/pal3_fastlane.py \
            --config projects/pal3-unity/fast-tests.json \
            --workspace .control/upstream \
            --out out/pal3-unity \
            --temp .control/fastlane

      - name: Publish fast-lane summary
        if: always()
        shell: bash
        run: |
          if [ -f out/pal3-unity/source_control_report.md ]; then
            cat out/pal3-unity/source_control_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/pal3-unity/fastlane_report.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/pal3-unity/fastlane_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload realtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pal3-chat-fastlane-evidence
          path: out/pal3-unity/
          if-no-files-found: error
