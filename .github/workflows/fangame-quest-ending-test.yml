name: Fangame Quest Ending Inference Test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_quest_ending_infer.py'
      - 'tests/test_fangame_quest_ending_infer.py'
      - '.github/workflows/fangame-quest-ending-test.yml'

jobs:
  test-quest-ending-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run tests
        run: python3 -m pytest -q tests/test_fangame_quest_ending_infer.py
