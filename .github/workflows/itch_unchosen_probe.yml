name: Probe Unchosen itch uploads
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve public itch upload metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import re, requests
          page='https://aldrine.itch.io/pokemon-unchosen'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          text=s.get(page,timeout=30).text
          for uid in ['18657503','18872857','18873269']:
              m=re.search(r'data-upload_id=["\']'+uid+r'["\']',text,re.I)
              if not m:
                  print('NO_MATCH',uid); continue
              raw=text[max(0,m.start()-650):min(len(text),m.end()+850)]
              print('\n===UPLOAD',uid,'===\n',raw.replace('\n',' ')[:1500])
          PY
