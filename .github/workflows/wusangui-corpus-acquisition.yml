name: Wu Sangui Public-Domain Corpus Acquisition

on:
  push:
    paths:
      - '.github/workflows/wusangui-corpus-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: wusangui_corpus

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare corpus
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT/00_PRIMARY_PUBLIC_DOMAIN/scans" "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text" "$OUT/01_MODERN_SECONDARY_REFERENCES" "$OUT/02_MANIFEST"

      - name: Fetch open full-text mirrors directly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://raw.githubusercontent.com/tanpero/Reservator/master/%E6%98%8E%E5%AD%A3%E5%8D%97%E7%95%A5.md' -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/明季南略_Reservator.md"
          curl -fL --retry 4 --retry-delay 2 'https://raw.githubusercontent.com/tanpero/Reservator/master/%E6%98%8E%E5%AD%A3%E5%8C%97%E7%95%A5.md' -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/明季北略_Reservator.md"
          curl -fL --retry 4 --retry-delay 2 'https://raw.githubusercontent.com/dooshu/shu/main/cn/1462.txt' -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/庭闻录_刘健_dooshu.txt"

      - name: Fetch Wikisource public-domain snapshots
        shell: bash
        run: |
          set -euxo pipefail
          ua='Mozilla/5.0 (public-domain historical research archival)'
          for title in '吳三桂考' '國榷' '平定三逆方略'; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$title")
            curl -fL --retry 4 --retry-delay 2 -A "$ua" "https://zh.wikisource.org/w/index.php?title=${enc}&printable=yes" -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/${title}_Wikisource_printable.html" || true
            curl -fL --retry 4 --retry-delay 2 -A "$ua" "https://zh.wikisource.org/w/index.php?title=${enc}&action=raw" -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/${title}_Wikisource_raw.wiki" || true
          done

      - name: Download public-domain scans from Wikimedia Commons
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/grab.py <<'PY'
          import hashlib, pathlib, urllib.parse, urllib.request, time
          out=pathlib.Path('wusangui_corpus/00_PRIMARY_PUBLIC_DOMAIN/scans'); out.mkdir(parents=True,exist_ok=True)
          names=[
          'SSID-10059981 台灣文獻史料叢刊 第6輯 104 平定三逆方略 全.pdf',
          'SSID-10113913 明季南略.pdf',
          'NLC416-02jh005212-14871 明季北略.pdf',
          'NLC416-02jh004904-15032 清史稿.pdf',
          'SSID-11568960 四部叢刊三編 史部 罪惟錄 第1冊.pdf',
          'SSID-11568961 四部叢刊三編 史部 罪惟錄 第2冊.pdf',
          'SSID-11568962 四部叢刊三編 史部 罪惟錄 第3冊.pdf',
          'SSID-11568963 四部叢刊三編 史部 罪惟錄 第4冊.pdf',
          'SSID-11568964 四部叢刊三編 史部 罪惟錄 第5冊.pdf']
          rows=[]
          for fn in names:
              norm=fn.replace(' ','_'); h=hashlib.md5(norm.encode()).hexdigest(); url=f'https://upload.wikimedia.org/wikipedia/commons/{h[0]}/{h[:2]}/{urllib.parse.quote(norm)}'; dest=out/fn
              status='FAILED'; err=''
              for n in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 public-domain-research-archiver'})
                      with urllib.request.urlopen(req,timeout=180) as r, dest.open('wb') as f:
                          while True:
                              b=r.read(2*1024*1024)
                              if not b: break
                              f.write(b)
                      if dest.stat().st_size>1024:
                          status='OK'; break
                  except Exception as e:
                      err=repr(e); time.sleep(2*(n+1))
              rows.append((fn,url,status,dest.stat().st_size if dest.exists() else 0,err))
              print(rows[-1])
          p=pathlib.Path('wusangui_corpus/02_MANIFEST/commons_download.tsv')
          p.write_text('filename\turl\tstatus\tbytes\terror\n'+''.join('\t'.join(map(str,r))+'\n' for r in rows),encoding='utf-8')
          if not any(r[2]=='OK' for r in rows): raise SystemExit('all Commons downloads failed')
          PY
          python3 /tmp/grab.py

      - name: Record canonical source list and copyright boundary
        shell: bash
        run: |
          cat > "$OUT/02_MANIFEST/NOTION_CANONICAL_SOURCE_LIST.md" <<'EOF'
          # 吴三桂｜Notion canonical source list
          Historical/core: 《清史稿》《平定三逆方略》《吴三桂纪略》《明季南略》《明季北略》《国榷》《罪惟录》.
          Modern: 顾诚《南明史》(1997; already archived by user); 李治亭《吴三桂大传》(1991); 滕绍箴《吴三桂传》(2008).
          Added public-domain high-value sources: 刘健《庭闻录》; 《吴三桂考》 collection (《平滇始末》《平吴录》《吴逆取亡录》《吴逆始末记》《吴三桂纪略》 etc.).
          EOF
          cat > "$OUT/01_MODERN_SECONDARY_REFERENCES/COPYRIGHT_BOUNDARY.md" <<'EOF'
          # Copyright boundary
          No unauthorized modern copyrighted book was downloaded.
          顾诚《南明史》 is already present in the user's Drive corpus and is not duplicated.
          李治亭《吴三桂大传》(1991) and 滕绍箴《吴三桂传》(2008) remain lawful-acquisition targets unless the user supplies owned copies or an authorized library source.
          EOF

      - name: Build integrity manifest
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('wusangui_corpus'); rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
                  rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'02_MANIFEST/manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FILES',len(rows),'BYTES',sum(x['bytes'] for x in rows))
          PY
          find "$OUT" -type f -printf '%s\t%p\n' | sort -n

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: wusangui-public-domain-corpus
          path: wusangui_corpus/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
