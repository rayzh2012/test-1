name: Wu Sangui Public-Domain Corpus Acquisition

on:
  push:
    paths:
      - '.github/workflows/wusangui-corpus-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: wusangui_corpus

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Prepare corpus directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT/00_PRIMARY_PUBLIC_DOMAIN/scans" \
                   "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text" \
                   "$OUT/01_MODERN_SECONDARY_REFERENCES" \
                   "$OUT/02_MANIFEST"

      - name: Clone open classical-text mirrors
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/tanpero/Reservator.git /tmp/Reservator
          git clone --depth 1 https://github.com/dooshu/shu.git /tmp/shu

          cp /tmp/Reservator/明季南略.md "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/明季南略_Reservator.md"
          cp /tmp/Reservator/明季北略.md "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/明季北略_Reservator.md"

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('/tmp/shu/cn')
          out = Path('wusangui_corpus/00_PRIMARY_PUBLIC_DOMAIN/open_text')
          wanted = ['庭闻录','清史稿','明季南略','明季北略','罪惟录','國榷','国榷','平定三逆方略','吴三桂考','吳三桂考','吴三桂纪略','吳三桂紀略']
          hits=[]
          for p in src.glob('*.txt'):
              try:
                  head = p.read_text('utf-8', errors='ignore')[:400]
              except Exception:
                  continue
              for key in wanted:
                  if key in head:
                      dst = out / f'{key}_dooshu_{p.name}'
                      shutil.copy2(p,dst)
                      hits.append((key,p.name,dst.name))
                      break
          Path('wusangui_corpus/02_MANIFEST/dooshu_hits.tsv').write_text(
              'key\tsource_file\tarchived_name\n' + ''.join(f'{a}\t{b}\t{c}\n' for a,b,c in hits), encoding='utf-8')
          print('dooshu hits:', hits)
          PY

      - name: Fetch Wikisource public-domain text snapshots
        shell: bash
        run: |
          set -euxo pipefail
          ua='Mozilla/5.0 (WuSangui research archival; public-domain acquisition)'
          for title in '吳三桂考' '國榷' '平定三逆方略'; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$title")
            curl --fail --location --retry 4 --retry-delay 3 -A "$ua" \
              "https://zh.wikisource.org/w/index.php?title=${enc}&printable=yes" \
              -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/${title}_Wikisource_printable.html" || true
            curl --fail --location --retry 4 --retry-delay 3 -A "$ua" \
              "https://zh.wikisource.org/w/index.php?title=${enc}&action=raw" \
              -o "$OUT/00_PRIMARY_PUBLIC_DOMAIN/open_text/${title}_Wikisource_raw.wiki" || true
          done

      - name: Download public-domain scans from Wikimedia Commons
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/grab_commons.py <<'PY'
          import hashlib, pathlib, urllib.parse, urllib.request, time
          OUT=pathlib.Path('wusangui_corpus/00_PRIMARY_PUBLIC_DOMAIN/scans')
          OUT.mkdir(parents=True,exist_ok=True)
          files = [
            'SSID-10059981 台灣文獻史料叢刊 第6輯 104 平定三逆方略 全.pdf',
            'SSID-10113913 明季南略.pdf',
            'NLC416-02jh005212-14871 明季北略.pdf',
            'NLC416-02jh004904-15032 清史稿.pdf',
            'SSID-11568960 四部叢刊三編 史部 罪惟錄 第1冊.pdf',
            'SSID-11568961 四部叢刊三編 史部 罪惟錄 第2冊.pdf',
            'SSID-11568962 四部叢刊三編 史部 罪惟錄 第3冊.pdf',
            'SSID-11568963 四部叢刊三編 史部 罪惟錄 第4冊.pdf',
            'SSID-11568964 四部叢刊三編 史部 罪惟錄 第5冊.pdf',
          ]
          log=[]
          for fn in files:
              h=hashlib.md5(fn.replace(' ','_').encode()).hexdigest()
              encoded=urllib.parse.quote(fn.replace(' ','_'))
              url=f'https://upload.wikimedia.org/wikipedia/commons/{h[0]}/{h[:2]}/{encoded}'
              dest=OUT/fn
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 public-domain-research-archiver'})
              ok=False; err=''
              for attempt in range(4):
                  try:
                      print('GET',url)
                      with urllib.request.urlopen(req,timeout=120) as r, open(dest,'wb') as f:
                          while True:
                              chunk=r.read(1024*1024)
                              if not chunk: break
                              f.write(chunk)
                      ok=dest.stat().st_size>0
                      if ok: break
                  except Exception as e:
                      err=repr(e); time.sleep(3*(attempt+1))
              log.append((fn,url,'OK' if ok else 'FAILED', dest.stat().st_size if dest.exists() else 0,err))
          m=pathlib.Path('wusangui_corpus/02_MANIFEST/commons_download.tsv')
          m.write_text('filename\turl\tstatus\tbytes\terror\n'+''.join('\t'.join(map(str,row))+'\n' for row in log),encoding='utf-8')
          if not any(row[2]=='OK' for row in log):
              raise SystemExit('all Commons downloads failed')
          PY
          python3 /tmp/grab_commons.py

      - name: Record canonical Notion source list and copyright boundary
        shell: bash
        run: |
          cat > "$OUT/02_MANIFEST/NOTION_CANONICAL_SOURCE_LIST.md" <<'EOF'
          # 吴三桂｜Notion canonical source list

          Historical/core sources recovered from the existing Wu Sangui Notion page:
          - 《清史稿》
          - 《平定三逆方略》
          - 《吴三桂纪略》
          - 《明季南略》
          - 《明季北略》
          - 《国榷》
          - 《罪惟录》

          Modern secondary works:
          - 顾诚《南明史》(1997) — already present in the user's canonical Drive corpus; do not duplicate.
          - 李治亭《吴三桂大传》(1991) — copyrighted; catalog/reference only unless a user-owned copy is supplied.
          - 滕绍箴《吴三桂传》(2008) — copyrighted; catalog/reference only unless a user-owned copy is supplied.

          Added high-value public-domain Wu Sangui source:
          - 刘健《庭闻录》
          - 《吴三桂考》 collection (contains 《平滇始末》《平吴录》《吴逆取亡录》《吴逆始末记》 and 《吴三桂纪略》)
          EOF
          cat > "$OUT/01_MODERN_SECONDARY_REFERENCES/COPYRIGHT_BOUNDARY.md" <<'EOF'
          # Copyright boundary
          No unauthorized modern copyrighted book was downloaded by this workflow.
          Gu Cheng's 《南明史》 is referenced only because the user already owns/archived a copy in Drive.
          李治亭《吴三桂大传》(1991) and 滕绍箴《吴三桂传》(2008) remain acquisition targets only through lawful user-supplied/library/authorized channels.
          EOF

      - name: Build integrity manifest
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('wusangui_corpus')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
                  rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'02_MANIFEST'/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('files',len(rows),'bytes',sum(r['bytes'] for r in rows))
          PY
          du -ah "$OUT" | sort -h | tail -50

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: wusangui-public-domain-corpus
          path: wusangui_corpus/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
