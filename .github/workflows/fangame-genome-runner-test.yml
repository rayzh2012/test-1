name: Fangame Genome Universal Runner Test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_genome_runner.py'
      - 'tests/test_fangame_genome_opaque.py'
      - '.github/workflows/fangame-genome-runner-test.yml'
  workflow_dispatch:

jobs:
  real-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby
          python3 -m pip install pillow pytest
      - name: Run opaque-mode unit tests
        run: python3 -m pytest -q tests/test_fangame_genome_opaque.py
      - name: Run universal Genome runner
        run: |
          python3 tools/fangame_genome_runner.py \
            --target-json fangame_targets/nulong_zhanji3_v30.json \
            --outdir out/genome \
            --workdir out/work
      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('out/genome')
          required=['playability_static.json','dialogue_corpus.json','map_graph.json','map_graph_normalized.json','content_inference.json','asset_fingerprint.json','perceptual_hash.json','genome_summary.json','genome_audit.json']
          missing=[x for x in required if not (root/x).exists()]
          assert not missing, missing
          s=json.load(open(root/'genome_summary.json'))
          assert s['content_visibility']=='INSPECTABLE'
          assert s['maps'] >= 100
          assert s['total_pipeline_wall_time_sec'] > 0
          assert 'stage_wall_time_sec' in s
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nulong-universal-genome-runner
          path: out/genome
          retention-days: 14
