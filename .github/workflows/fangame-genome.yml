name: Fangame Genome

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_inspect.py'
      - 'tools/rpgmaker_marshal_probe.rb'
      - 'tools/rpgmaker_graph_probe.rb'
      - 'tools/rpgmaker_marshal_lib.rb'
      - 'tools/rpgmaker_dialogue_extract.rb'
      - 'tools/rpgmaker_map_graph.rb'
      - 'tools/rpgmaker_graph_normalize.py'
      - 'tools/rpgmaker_event_inventory.rb'
      - 'tools/fangame_event_phase.py'
      - 'tools/fangame_asset_fingerprint.py'
      - 'tools/fangame_perceptual_hash.py'
      - 'tools/fangame_content_infer.py'
      - 'tests/test_rpgmaker_map_inventory.py'
      - '.github/workflows/fangame-genome.yml'
  workflow_dispatch:

jobs:
  genome-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: nulong-zhanji3
            title: 怒龙战记3 V3.0
            target: fangame_targets/nulong_zhanji3_v30.json
          - slug: magic-baby-120
            title: 魔力宝贝单机版 1.20 解密版
            target: fangame_targets/magic_baby_120.json
    steps:
      - uses: actions/checkout@v5
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby
          python3 -m pip install pillow
      - name: Fetch benchmark package
        run: |
          rm -rf out genome_work && mkdir -p out
          python3 tools/fangame_fetcher.py "${{ matrix.target }}" -o out
      - name: Extract and identify game root
        run: |
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('out/fetch_report.json'))['file'])
          PY
          )
          python3 tools/fangame_inspect.py "out/$game" --workdir genome_work --out out/playability_static.json
          python3 - <<'PY' > out/game_root.txt
          import json, pathlib
          st=json.load(open('out/playability_static.json'))
          print((pathlib.Path('genome_work/extract')/st['game_root']).resolve())
          PY
      - name: Extract dialogue corpus
        run: ruby tools/rpgmaker_dialogue_extract.rb "$(cat out/game_root.txt)" --out out/dialogue_corpus.json
      - name: Export map and state graph
        run: ruby tools/rpgmaker_map_graph.rb "$(cat out/game_root.txt)" --out out/map_graph.json
      - name: Normalize map topology
        run: python3 tools/rpgmaker_graph_normalize.py out/map_graph.json --out out/map_graph_normalized.json
      - name: Inventory events and character usage
        run: ruby tools/rpgmaker_event_inventory.rb "$(cat out/game_root.txt)" --out out/event_inventory.json
      - name: Distribute events across topology phases
        run: python3 tools/fangame_event_phase.py out/event_inventory.json out/map_graph_normalized.json --out out/event_phase.json
      - name: Infer content semantic classes
        run: python3 tools/fangame_content_infer.py out/dialogue_corpus.json out/map_graph.json out/map_graph_normalized.json --out out/content_inference.json
      - name: Fingerprint assets
        run: python3 tools/fangame_asset_fingerprint.py "$(cat out/game_root.txt)" --out out/asset_fingerprint.json
      - name: Mine perceptual image similarity
        run: python3 tools/fangame_perceptual_hash.py "$(cat out/game_root.txt)" --threshold 6 --out out/perceptual_hash.json
      - name: Build genome summary
        env:
          GAME_TITLE: ${{ matrix.title }}
        run: |
          python3 - <<'PY'
          import json,os
          st=json.load(open('out/playability_static.json')); d=json.load(open('out/dialogue_corpus.json'))['summary']; g=json.load(open('out/map_graph.json'))['summary']; gn=json.load(open('out/map_graph_normalized.json'))['summary']; ei=json.load(open('out/event_inventory.json')); ep=json.load(open('out/event_phase.json')); ci=json.load(open('out/content_inference.json'))['summary']; a=json.load(open('out/asset_fingerprint.json'))['summary']; ph=json.load(open('out/perceptual_hash.json'))['summary']; m=st.get('marshal_content') or {}; maps=max(1,g.get('map_nodes',0))
          summary={
            'schema':'fangame-genome-v0.7','title':os.environ['GAME_TITLE'],'engine':st.get('engine'),
            'maps':g.get('map_nodes'),'events':ei['summary'].get('events'),'event_pages':ei['summary'].get('event_pages'),
            'named_database_actors':ei['summary'].get('named_database_actors'),'actor_names':ei.get('actor_names',[]),
            'unique_event_character_graphics':ei['summary'].get('unique_event_character_graphics'),'top_event_character_graphics':ei.get('character_graphics',[])[:30],
            'image_count':st.get('image_count'),'audio_count':st.get('audio_count'),
            'dialogue_blocks':d.get('dialogue_blocks'),'dialogue_chars':d.get('dialogue_chars'),'dialogue_density_chars_per_map':round(d.get('dialogue_chars',0)/maps,2),
            'unique_dialogue_blocks':d.get('unique_dialogue_blocks'),'duplicate_dialogue_blocks':d.get('duplicate_dialogue_blocks'),
            'raw_transfer_commands':g.get('transfer_edges'),'raw_branching_maps':g.get('branching_maps'),'raw_terminal_maps':g.get('terminal_maps'),
            'unique_directed_edges':gn.get('unique_directed_edges'),'normalized_undirected_edges':gn.get('normalized_undirected_edges'),'normalized_branching_maps_degree_ge_3':gn.get('normalized_branching_maps_degree_ge_3'),'normalized_leaf_maps_degree_1':gn.get('normalized_leaf_maps_degree_1'),'isolated_maps_degree_0':gn.get('isolated_maps_degree_0'),'connected_component_count':gn.get('connected_component_count'),'largest_component_size':gn.get('largest_component_size'),
            'start_map_id':ep.get('start_map_id'),'max_map_distance_from_start':ep.get('max_shortest_path_distance'),'event_phase_distribution':ep.get('summary_by_phase'),
            'switch_ids_read':g.get('switch_ids_read'),'switch_ids_written':g.get('switch_ids_written'),'variable_ids_read':g.get('variable_ids_read'),'variable_ids_written':g.get('variable_ids_written'),
            'sidequest_candidate_maps':ci.get('sidequest_candidate_maps'),'sidequest_high_confidence_maps':ci.get('sidequest_high_confidence_maps'),'sidequest_medium_confidence_maps':ci.get('sidequest_medium_confidence_maps'),'explicit_sidequest_maps':ci.get('explicit_sidequest_maps'),'mainline_gate_maps':ci.get('mainline_gate_maps'),'optional_content_maps':ci.get('optional_content_maps'),'unresolved_quest_candidate_maps':ci.get('unresolved_quest_candidate_maps'),'content_endpoint_maps':ci.get('content_endpoint_maps'),'release_completion_status':ci.get('release_completion_status'),'ending_candidate_maps':ci.get('ending_candidate_maps'),'ending_high_confidence_maps':ci.get('ending_high_confidence_maps'),'ending_medium_confidence_maps':ci.get('ending_medium_confidence_maps'),
            'asset_files':a.get('asset_files'),'unique_asset_hashes':a.get('unique_content_hashes'),'exact_duplicate_groups':a.get('exact_duplicate_groups'),'exact_reuse_ratio':a.get('exact_reuse_ratio'),'perceptual_image_files':ph.get('image_files'),'near_duplicate_pairs':ph.get('near_duplicate_pairs'),'near_duplicate_clusters':ph.get('near_duplicate_clusters'),'perceptual_cluster_member_files':ph.get('cluster_member_files'),
            'actors':m.get('actors'),'classes':m.get('classes'),'skills':m.get('skills'),'items':m.get('items'),'weapons':m.get('weapons'),'armors':m.get('armors'),'enemies':m.get('enemies'),'troops':m.get('troops'),'states':m.get('states'),'common_events':m.get('common_events'),'battle_calls':m.get('battle_calls'),'shops':m.get('shop_calls'),'choices':m.get('choice_options'),
            'note':'Observed/derived metrics plus labeled candidate inference. EARLY/MID/LATE are shortest-path topology thirds from the RPG Maker start map, not proven narrative chapters.'}
          json.dump(summary,open('out/genome_summary.json','w'),ensure_ascii=False,indent=2); print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload genome evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-genome-v07
          path: |
            out/playability_static.json
            out/dialogue_corpus.json
            out/map_graph.json
            out/map_graph_normalized.json
            out/event_inventory.json
            out/event_phase.json
            out/content_inference.json
            out/asset_fingerprint.json
            out/perceptual_hash.json
            out/genome_summary.json
          retention-days: 14
          compression-level: 6
