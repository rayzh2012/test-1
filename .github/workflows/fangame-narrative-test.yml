name: Fangame Narrative Inference Test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_narrative_infer.py'
      - 'tests/test_fangame_narrative_infer.py'
      - '.github/workflows/fangame-narrative-test.yml'
  workflow_dispatch:

jobs:
  test-narrative-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run narrative inference tests
        run: python3 -m pytest -q tests/test_fangame_narrative_infer.py
