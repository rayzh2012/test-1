name: Current MV Browser Playability

on:
  pull_request:
    paths:
      - 'fangame_rescue/current_rescue.json'
      - '.github/workflows/current-mv-browser-playability.yml'
      - 'tools/fangame_mv_browser_probe.py'
      - 'tools/fangame_fetcher.py'
      - 'tools/fangame_inspect.py'
  workflow_dispatch:

jobs:
  mv-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Resolve target
        id: cfg
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('fangame_rescue/current_rescue.json',encoding='utf-8'))
          print('sample_id='+c['sample_id'])
          print('target='+c['target'])
          PY
      - name: Fetch exact package
        shell: bash
        run: |
          rm -rf browser_fetch browser_work browser_out
          mkdir -p browser_fetch browser_work browser_out
          python3 tools/fangame_fetcher.py '${{ steps.cfg.outputs.target }}' -o browser_fetch
      - name: Enforce identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          cfg=json.load(open('fangame_rescue/current_rescue.json',encoding='utf-8'))
          t=json.load(open(cfg['target'],encoding='utf-8'))
          g=json.load(open('browser_fetch/fetch_report.json',encoding='utf-8'))
          if t.get('expected_bytes') is not None and g.get('bytes') != t['expected_bytes']:
              raise SystemExit('BYTE_IDENTITY_MISMATCH')
          if t.get('expected_sha256') and (g.get('sha256') or '').lower() != t['expected_sha256'].lower():
              raise SystemExit('SHA256_IDENTITY_MISMATCH')
          print('PACKAGE_IDENTITY_VERIFIED')
          PY
      - name: Install extract and browser probe dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby
          python3 -m pip install --disable-pip-version-check playwright
          which google-chrome || which google-chrome-stable || which chromium || true
      - name: Static inspect and extract
        shell: bash
        run: |
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('browser_fetch/fetch_report.json',encoding='utf-8'))['file'])
          PY
          )
          python3 tools/fangame_inspect.py \
            "browser_fetch/$game" \
            --workdir browser_work \
            --out browser_out/playability_static.json
      - name: Run native browser MV probe
        shell: bash
        run: |
          python3 tools/fangame_mv_browser_probe.py \
            --static browser_out/playability_static.json \
            --extract-root browser_work/extract \
            --outdir browser_out/mv_browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mv-browser-${{ steps.cfg.outputs.sample_id }}
          path: |
            browser_fetch/fetch_report.json
            browser_fetch/SHA256.txt
            browser_out/playability_static.json
            browser_out/mv_browser/mv_browser_probe.json
            browser_out/mv_browser/*.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
