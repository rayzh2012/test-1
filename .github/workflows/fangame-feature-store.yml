name: Fangame Feature Store

on:
  workflow_run:
    workflows: ["Fangame Fetch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Fangame Fetch run ID to normalize"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id="${{ inputs.source_run_id }}"
            head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha // ""')
          else
            run_id="${{ github.event.workflow_run.id }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout current normalization/inference tooling
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Download metadata evidence contracts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feature_input feature_records
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | endswith("-metadata"))) | [.id,.name] | @tsv' > /tmp/metadata.tsv
          if [ ! -s /tmp/metadata.tsv ]; then
            echo "No *-metadata artifacts found on source run ${SOURCE_RUN_ID}" >&2
            exit 2
          fi
          while IFS=$'\t' read -r artifact_id artifact_name; do
            base="${artifact_name%-metadata}"
            dest="feature_input/${base}"
            mkdir -p "$dest"
            curl -fL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "/tmp/${artifact_id}.zip"
            unzip -q -o "/tmp/${artifact_id}.zip" -d "$dest"
            echo "Downloaded ${artifact_name} -> ${dest}"
          done < /tmp/metadata.tsv

      - name: Emit canonical v0.4 feature records
        env:
          SOURCE_FETCH_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_FETCH_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for d in feature_input/*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")
            out="feature_records/${base}"
            mkdir -p "$out"

            args=(--fetch "$d/fetch_report.json" --out "$out/fangame_features.json")
            [ -f "$d/playability_static.json" ] && args+=(--static "$d/playability_static.json")
            [ -f "$d/playability_smoke.json" ] && args+=(--smoke "$d/playability_smoke.json")
            [ -f "$d/fangame_review_card.json" ] && args+=(--review "$d/fangame_review_card.json")
            [ -f "$d/SHA256.txt" ] && args+=(--sha256 "$d/SHA256.txt")
            [ -f "fangame_targets/${base}.json" ] && args+=(--target "fangame_targets/${base}.json")
            python3 tools/fangame_feature_emitter.py "${args[@]}"

            graph_merge=(--features "$out/fangame_features.json" --out "$out/fangame_features.json")
            if [ -f "$d/rpgmaker_graph.json" ]; then
              cp "$d/rpgmaker_graph.json" "$out/rpgmaker_graph.json"
              graph_merge+=(--graph "$out/rpgmaker_graph.json")
            fi
            python3 tools/fangame_graph_feature_merge.py "${graph_merge[@]}"

            inference_merge=(--features "$out/fangame_features.json" --out "$out/fangame_features.json")
            if [ -f "$out/rpgmaker_graph.json" ]; then
              python3 tools/fangame_graph_inference.py --graph "$out/rpgmaker_graph.json" --out "$out/fangame_inference.json"
              inference_merge+=(--inference "$out/fangame_inference.json")
            fi
            python3 tools/fangame_inference_feature_merge.py "${inference_merge[@]}"

            python3 - "$out/fangame_features.json" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          rec=json.loads(p.read_text(encoding='utf-8'))
          audit=rec.setdefault('audit',{})
          audit['source_fetch_run_id']=os.environ.get('SOURCE_FETCH_RUN_ID')
          audit['source_fetch_head_sha']=os.environ.get('SOURCE_FETCH_HEAD_SHA') or None
          p.write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

            cp schemas/fangame_features_v04.schema.json "$out/fangame_features.schema.json"
          done

      - name: Validate v0.4 feature records
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema
          python3 - <<'PY'
          import json, pathlib, jsonschema
          schema=json.loads(pathlib.Path('schemas/fangame_features_v04.schema.json').read_text(encoding='utf-8'))
          files=list(pathlib.Path('feature_records').glob('*/fangame_features.json'))
          assert files, 'no canonical feature records'
          for f in files:
              rec=json.loads(f.read_text(encoding='utf-8'))
              jsonschema.validate(rec,schema)
              assert rec['schema_version']=='fangame.features.v0.4'
              assert 'graph' in rec and 'inferred' in rec
              assert rec['audit'].get('source_fetch_run_id')
          print(json.dumps({'records':len(files),'schema':'fangame.features.v0.4','validated':True}))
          PY

      - name: Build analytical Feature Store assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fangame_feature_batch.py feature_records \
            --ndjson fangame_feature_store.ndjson \
            --csv fangame_feature_store.csv
          python3 - <<'PY'
          import csv,json,pathlib
          p=pathlib.Path('fangame_feature_store.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          assert rows, 'feature store is empty'
          required={
            'schema_version','identity.title','identity.archive_filename','graph.status',
            'inferred.sidequest_candidate_count','inferred.ending_candidate_count',
            'audit.source_fetch_run_id','audit.inference_version'
          }
          missing=required-set(rows[0])
          assert not missing, f'missing required flattened columns: {missing}'
          print(json.dumps({'records':len(rows),'required_columns_ok':True},ensure_ascii=False))
          PY

      - name: Upload canonical Feature Store
        uses: actions/upload-artifact@v4
        with:
          name: fangame-feature-store-${{ steps.source.outputs.run_id }}
          path: |
            feature_records/**/fangame_features.json
            feature_records/**/fangame_features.schema.json
            feature_records/**/rpgmaker_graph.json
            feature_records/**/fangame_inference.json
            fangame_feature_store.ndjson
            fangame_feature_store.csv
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
