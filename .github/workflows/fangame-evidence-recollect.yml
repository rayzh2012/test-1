name: Fangame Evidence Recollect

on:
  pull_request:
    branches: [master]
    paths:
      - 'fangame_recollect/**.json'
      - 'tools/fangame_inspect.py'
      - 'tools/rpgmaker_marshal_probe.rb'
      - 'tools/rpgmaker_graph_probe.rb'
      - 'tools/fangame_feature_emitter.py'
      - 'tools/fangame_graph_feature_merge.py'
      - 'tools/fangame_graph_inference.py'
      - 'tools/fangame_inference_feature_merge.py'
      - 'schemas/fangame_features_v04.schema.json'
      - '.github/workflows/fangame-evidence-recollect.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: find
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, subprocess
          if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request':
              base=os.environ.get('GITHUB_BASE_REF','master')
              p=subprocess.run(['git','diff','--name-only',f'origin/{base}...HEAD','--','fangame_recollect/*.json'],capture_output=True,text=True,check=True)
              files=[x.strip() for x in p.stdout.splitlines() if x.strip().endswith('.json') and os.path.exists(x.strip())]
          else:
              files=glob.glob('fangame_recollect/*.json')
          print('manifests='+json.dumps(files,ensure_ascii=False))
          PY

  recollect:
    needs: discover
    if: needs.discover.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.discover.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v5

      - name: Read recollect manifest
        id: m
        shell: bash
        run: |
          python3 - '${{ matrix.manifest }}' <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          for key in ['source_run_id','source_artifact','archive_filename','expected_bytes','expected_sha256','name','version']:
              v=d.get(key,'')
              print(f'{key}={v}')
          print(f'base={p.stem}')
          PY

      - name: Download already-captured full artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.m.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.m.outputs.source_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence out recollect_work
          artifact_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .name == \"${SOURCE_ARTIFACT}\") | .id" | head -n1)
          test -n "$artifact_id" || { echo "Artifact not found or expired: ${SOURCE_ARTIFACT} on run ${SOURCE_RUN_ID}" >&2; exit 2; }
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/source-artifact.zip
          unzip -q /tmp/source-artifact.zip -d evidence
          echo "artifact_id=${artifact_id}" >> "$GITHUB_ENV"

      - name: Verify package identity before recollection
        env:
          ARCHIVE_NAME: ${{ steps.m.outputs.archive_filename }}
          EXPECTED_BYTES: ${{ steps.m.outputs.expected_bytes }}
          EXPECTED_SHA256: ${{ steps.m.outputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find evidence -type f -name "$ARCHIVE_NAME" -print -quit)
          test -n "$archive" || { echo "Archive not found: $ARCHIVE_NAME" >&2; exit 3; }
          got_bytes=$(stat -c%s "$archive")
          got_sha=$(sha256sum "$archive" | awk '{print $1}')
          test "$got_bytes" = "$EXPECTED_BYTES" || { echo "Size mismatch: $got_bytes != $EXPECTED_BYTES" >&2; exit 4; }
          test "$got_sha" = "$EXPECTED_SHA256" || { echo "SHA mismatch: $got_sha != $EXPECTED_SHA256" >&2; exit 5; }
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$got_sha" "$ARCHIVE_NAME" > out/SHA256.txt

      - name: Install static graph probe dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby
          command -v 7z
          command -v ruby

      - name: Recollect current static + graph evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fangame_inspect.py "$ARCHIVE_PATH" \
            --workdir recollect_work \
            --out out/playability_static.json \
            --graph-out out/rpgmaker_graph.json
          test -s out/rpgmaker_graph.json
          python3 - <<'PY'
          import json
          g=json.load(open('out/rpgmaker_graph.json',encoding='utf-8'))
          print(json.dumps({'graph_version':g.get('graph_version'),'summary':g.get('summary')},ensure_ascii=False,indent=2))
          assert g.get('summary',{}).get('maps_loaded',0) > 0
          assert g.get('summary',{}).get('load_error_count',999) == 0
          PY

      - name: Reuse historical runtime evidence and emit current v0.4 record
        shell: bash
        run: |
          set -euo pipefail
          fetch=$(find evidence -type f -name fetch_report.json -print -quit)
          smoke=$(find evidence -type f -name playability_smoke.json -print -quit)
          review=$(find evidence -type f -name fangame_review_card.json -print -quit)
          test -n "$fetch"
          args=(--fetch "$fetch" --static out/playability_static.json --sha256 out/SHA256.txt --target '${{ matrix.manifest }}' --out out/fangame_features.json)
          [ -n "$smoke" ] && args+=(--smoke "$smoke")
          [ -n "$review" ] && args+=(--review "$review")
          python3 tools/fangame_feature_emitter.py "${args[@]}"
          python3 tools/fangame_graph_feature_merge.py \
            --features out/fangame_features.json --graph out/rpgmaker_graph.json --out out/fangame_features.json
          python3 tools/fangame_graph_inference.py \
            --graph out/rpgmaker_graph.json --out out/fangame_inference.json
          python3 tools/fangame_inference_feature_merge.py \
            --features out/fangame_features.json --inference out/fangame_inference.json --out out/fangame_features.json

      - name: Stamp recollection provenance and validate
        env:
          SOURCE_RUN_ID: ${{ steps.m.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.m.outputs.source_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema
          python3 - <<'PY'
          import json, os, pathlib, jsonschema
          p=pathlib.Path('out/fangame_features.json')
          rec=json.loads(p.read_text(encoding='utf-8'))
          audit=rec.setdefault('audit',{})
          audit['recollect_source_run_id']=os.environ['SOURCE_RUN_ID']
          audit['recollect_source_artifact']=os.environ['SOURCE_ARTIFACT']
          audit['recollect_artifact_id']=os.environ.get('artifact_id')
          audit['recollect_mode']='REUSE_CAPTURED_BINARY_NO_REFETCH'
          p.write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          schema=json.loads(pathlib.Path('schemas/fangame_features_v04.schema.json').read_text(encoding='utf-8'))
          jsonschema.validate(rec,schema)
          assert rec['schema_version']=='fangame.features.v0.4'
          assert rec['graph']['status']=='GRAPH_OBSERVED'
          assert rec['graph']['summary'].get('maps_loaded',0)>0
          print(json.dumps({
            'title':rec['identity'].get('title'),
            'graph':rec['graph'].get('summary'),
            'sidequest_candidate_count':rec['inferred'].get('sidequest_candidate_count'),
            'sidequest_confidence':rec['inferred'].get('sidequest_confidence'),
            'ending_candidate_count':rec['inferred'].get('ending_candidate_count'),
            'ending_confidence':rec['inferred'].get('ending_confidence')
          },ensure_ascii=False,indent=2))
          PY
          cp schemas/fangame_features_v04.schema.json out/fangame_features.schema.json
          cp '${{ matrix.manifest }}' out/recollect_manifest.json

      - name: Upload recollected evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.m.outputs.base }}-recollect-v04
          path: |
            out/SHA256.txt
            out/playability_static.json
            out/rpgmaker_graph.json
            out/fangame_inference.json
            out/fangame_features.json
            out/fangame_features.schema.json
            out/recollect_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
