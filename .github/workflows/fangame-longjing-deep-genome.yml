name: Fangame Longjing Deep Genome

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/fangame-longjing-deep-genome.yml'
      - 'tools/installshield_cab_inventory.py'
      - 'tools/fangame_genome_runner.py'
      - 'tools/fangame_inspect.py'
      - 'tools/rpgmaker_*.rb'
      - 'tools/fangame_content_infer.py'
      - 'tools/rpgmaker_graph_normalize.py'
  workflow_dispatch:

jobs:
  longjing-deep-genome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install extraction and Genome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract p7zip-full unar libarchive-tools ruby zip
          python3 -m pip install --disable-pip-version-check gdown pillow

      - name: Fetch historical public v1.64 package and verify identity
        run: |
          mkdir -p out work
          gdown --id 1k2oyWvYp6qoElokjcdBj2Uh6aR1fc54O -O work/longjing-v1.64.exe
          echo 'aee1a96dd72c5f083c72e5cfc81e45b33c25adf9deeb78dfc87ca0c09b4a0416  work/longjing-v1.64.exe' | sha256sum -c -
          stat -c '%n %s bytes' work/longjing-v1.64.exe

      - name: Inventory and carve embedded LZX Cabinet
        run: |
          python3 tools/installshield_cab_inventory.py work/longjing-v1.64.exe --out out/cab_inventory.json
          python3 - <<'PY'
          import json, pathlib
          src=pathlib.Path('work/longjing-v1.64.exe').read_bytes()
          inv=json.load(open('out/cab_inventory.json',encoding='utf-8'))
          off=inv['cab']['offset']; size=inv['cab']['bytes']
          assert inv['cab']['compression']=='LZX', inv['cab']
          assert inv['summary']['map_data_files']==199, inv['summary']
          pathlib.Path('work/longjing_payload.cab').write_bytes(src[off:off+size])
          print({'cab_offset':off,'cab_bytes':size,'compression':inv['cab']['compression']})
          PY

      - name: Decompress LZX payload without executing installer
        run: |
          mkdir -p work/longjing_extract
          cabextract -q -d work/longjing_extract work/longjing_payload.cab
          test -f work/longjing_extract/Data/Scripts.rvdata2
          test -f work/longjing_extract/Game.ini
          maps=$(find work/longjing_extract/Data -maxdepth 1 -type f -name 'Map*.rvdata2' | wc -l)
          files=$(find work/longjing_extract -type f | wc -l)
          echo "maps=$maps files=$files"
          test "$maps" -eq 199
          (cd work/longjing_extract && zip -qr ../longjing_payload.zip .)

      - name: Run Dragon Crystal through reusable Genome
        run: |
          python3 tools/fangame_genome_runner.py \
            --package work/longjing_payload.zip \
            --outdir out/longjing \
            --workdir work/longjing_genome \
            --skip-perceptual
          root=$(python3 - <<'PY'
          import json, pathlib
          st=json.load(open('out/longjing/playability_static.json',encoding='utf-8'))
          print((pathlib.Path('work/longjing_genome/inspect/extract')/st['game_root']).resolve())
          PY
          )
          ruby tools/rpgmaker_progression_probe.rb "$root" --out out/longjing/progression.json

      - name: Run baseline through the same current analyzer
        run: |
          python3 tools/fangame_genome_runner.py \
            --target-json fangame_targets/nulong_zhanji3_v30.json \
            --outdir out/nulong \
            --workdir work/nulong_genome \
            --skip-perceptual
          root=$(python3 - <<'PY'
          import json, pathlib
          st=json.load(open('out/nulong/playability_static.json',encoding='utf-8'))
          print((pathlib.Path('work/nulong_genome/inspect/extract')/st['game_root']).resolve())
          PY
          )
          ruby tools/rpgmaker_progression_probe.rb "$root" --out out/nulong/progression.json

      - name: Build same-scale density comparison
        run: |
          python3 - <<'PY'
          import json, pathlib
          def load_game(name):
              base=pathlib.Path('out')/name
              st=json.load(open(base/'playability_static.json',encoding='utf-8'))
              m=st.get('marshal_content') or {}
              g=json.load(open(base/'map_graph.json',encoding='utf-8'))['summary']
              d=json.load(open(base/'dialogue_corpus.json',encoding='utf-8'))['summary']
              gn=json.load(open(base/'map_graph_normalized.json',encoding='utf-8'))['summary']
              ci=json.load(open(base/'content_inference.json',encoding='utf-8'))['summary']
              pr=json.load(open(base/'progression.json',encoding='utf-8'))['observed']
              maps=m.get('maps_loaded') or g.get('map_nodes') or 0
              events=m.get('events') or 0
              pages=m.get('event_pages') or 0
              cmds=m.get('event_commands') or 0
              return {
                'engine':st.get('engine'),
                'maps':maps,
                'events':events,
                'event_pages':pages,
                'event_commands':cmds,
                'events_per_map':round(events/maps,3) if maps else None,
                'event_pages_per_map':round(pages/maps,3) if maps else None,
                'commands_per_map':round(cmds/maps,3) if maps else None,
                'commands_per_event':round(cmds/events,3) if events else None,
                'dialogue_blocks':d.get('dialogue_blocks'),
                'dialogue_chars':d.get('dialogue_chars'),
                'dialogue_chars_per_map':round((d.get('dialogue_chars') or 0)/maps,3) if maps else None,
                'choices':m.get('choice_options'),
                'explicit_battle_calls':m.get('battle_calls'),
                'shops':m.get('shop_calls'),
                'transfers':m.get('map_transfers'),
                'switch_ops':m.get('switch_ops'),
                'variable_ops':m.get('variable_ops'),
                'common_events':m.get('common_events'),
                'actors':m.get('actors'),'classes':m.get('classes'),'skills':m.get('skills'),'items':m.get('items'),
                'weapons':m.get('weapons'),'armors':m.get('armors'),'enemies':m.get('enemies'),'troops':m.get('troops'),'states':m.get('states'),
                'images':st.get('image_count'),'audio':st.get('audio_count'),
                'raw_transfer_edges':g.get('transfer_edges'),
                'normalized_edges':gn.get('normalized_undirected_edges'),
                'normalized_branching_maps':gn.get('normalized_branching_maps_degree_ge_3'),
                'connected_components':gn.get('connected_component_count'),
                'largest_component_size':gn.get('largest_component_size'),
                'sidequest_candidate_maps':ci.get('sidequest_candidate_maps'),
                'explicit_sidequest_maps':ci.get('explicit_sidequest_maps'),
                'mainline_gate_maps':ci.get('mainline_gate_maps'),
                'optional_content_maps':ci.get('optional_content_maps'),
                'ending_candidate_maps':ci.get('ending_candidate_maps'),
                'release_completion_status':ci.get('release_completion_status'),
                'random_encounter_maps':pr.get('maps_with_random_encounters'),
                'random_encounter_map_ratio':pr.get('random_encounter_map_ratio'),
                'encounter_step_stats':pr.get('encounter_step_stats'),
                'enemy_exp_stats':pr.get('enemy_exp_stats'),
                'enemy_gold_stats':pr.get('enemy_gold_stats'),
                'equipment_price_stats':pr.get('equipment_price_stats'),
                'progression_event_commands':pr.get('event_commands'),
                'marshal_load_errors':m.get('load_errors',[]),
              }
          games={'longjing_v1.64':load_game('longjing'),'nulong_v3.0':load_game('nulong')}
          a,b=games['longjing_v1.64'],games['nulong_v3.0']
          ratios={}
          for k in ['maps','events','event_pages','event_commands','events_per_map','event_pages_per_map','commands_per_map','dialogue_chars_per_map','choices','explicit_battle_calls','shops']:
              av,bv=a.get(k),b.get(k)
              ratios[k+'_longjing_over_nulong']=round(av/bv,4) if isinstance(av,(int,float)) and isinstance(bv,(int,float)) and bv else None
          out={'schema':'fangame-density-comparison-v1','analyzer_basis':'same commit / same parsers / same run','games':games,'ratios':ratios,
               'evidence_boundary':['explicit_battle_calls are event Battle Processing only; random encounters are separate','no-RTP audio count is not comparable to full-RTP package audio','candidate maps are inference, not official quest/ending counts']}
          pathlib.Path('out/density_comparison.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload deep evidence
        uses: actions/upload-artifact@v4
        with:
          name: longjing-v164-deep-genome
          path: |
            out/cab_inventory.json
            out/longjing/*.json
            out/nulong/*.json
            out/density_comparison.json
          retention-days: 14
          compression-level: 6
