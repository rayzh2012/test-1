name: Fangame Perceptual Hash Test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_perceptual_hash.py'
      - 'tests/test_fangame_perceptual_hash.py'
      - '.github/workflows/fangame-perceptual-hash-test.yml'
  workflow_dispatch:

jobs:
  test-perceptual-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: python3 -m pip install pytest pillow
      - name: Run tests
        run: python3 -m pytest -q tests/test_fangame_perceptual_hash.py
