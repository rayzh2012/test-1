name: Fangame Public Genome Test

on:
  push:
    paths:
      - 'tools/rpgmaker_mv_genome.py'
      - 'tools/fangame_normalized_profile.py'
      - 'tools/fangame_public_report.py'
      - 'tools/fangame_genome_runner.py'
      - 'tools/fangame_baseline_compare.py'
      - 'public_reports/baselines/schema_v0.1.json'
      - 'tests/test_mv_public_genome.py'
      - 'tests/test_rgss_normalized_profile.py'
      - 'tests/test_baseline_compare_v02.py'
      - '.github/workflows/fangame-public-genome-test.yml'
  pull_request:
    paths:
      - 'tools/rpgmaker_mv_genome.py'
      - 'tools/fangame_normalized_profile.py'
      - 'tools/fangame_public_report.py'
      - 'tools/fangame_genome_runner.py'
      - 'tools/fangame_baseline_compare.py'
      - 'public_reports/baselines/schema_v0.1.json'
      - 'tests/test_mv_public_genome.py'
      - 'tests/test_rgss_normalized_profile.py'
      - 'tests/test_baseline_compare_v02.py'
      - '.github/workflows/fangame-public-genome-test.yml'
  workflow_dispatch:

jobs:
  synthetic-public-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependency
        run: python3 -m pip install pytest
      - name: Syntax check
        run: |
          python3 -m py_compile \
            tools/rpgmaker_mv_genome.py \
            tools/fangame_normalized_profile.py \
            tools/fangame_public_report.py \
            tools/fangame_genome_runner.py \
            tools/fangame_baseline_compare.py
      - name: Run public genome contract tests
        run: |
          python3 -m pytest -q \
            tests/test_mv_public_genome.py \
            tests/test_rgss_normalized_profile.py \
            tests/test_baseline_compare_v02.py
