name: Fangame Feature Store Tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/fangame_feature_emitter.py'
      - 'tools/fangame_feature_batch.py'
      - 'tools/fangame_graph_feature_merge.py'
      - 'tools/fangame_graph_inference.py'
      - 'tools/fangame_inference_feature_merge.py'
      - 'tools/fangame_progression_feature_merge.py'
      - 'schemas/fangame_features.schema.json'
      - 'schemas/fangame_features_v03.schema.json'
      - 'schemas/fangame_features_v04.schema.json'
      - 'schemas/fangame_features_v05a.schema.json'
      - 'tests/test_fangame_feature_store.py'
      - 'tests/test_fangame_graph_feature_bridge.py'
      - 'tests/test_fangame_graph_inference.py'
      - 'tests/test_fangame_replay_v04.py'
      - 'tests/test_fangame_progression_feature_bridge.py'
      - 'tests/fixtures/fangame_nlzj3_feature_v02/**'
      - 'tests/fixtures/rpgmaker_graph_inference_v04.json'
      - '.github/workflows/fangame-feature-store.yml'
      - '.github/workflows/fangame-feature-store-test.yml'
  push:
    branches: [master]
    paths:
      - 'tools/fangame_feature_emitter.py'
      - 'tools/fangame_feature_batch.py'
      - 'tools/fangame_graph_feature_merge.py'
      - 'tools/fangame_graph_inference.py'
      - 'tools/fangame_inference_feature_merge.py'
      - 'tools/fangame_progression_feature_merge.py'
      - 'schemas/fangame_features.schema.json'
      - 'schemas/fangame_features_v03.schema.json'
      - 'schemas/fangame_features_v04.schema.json'
      - 'schemas/fangame_features_v05a.schema.json'
      - 'tests/test_fangame_feature_store.py'
      - 'tests/test_fangame_graph_feature_bridge.py'
      - 'tests/test_fangame_graph_inference.py'
      - 'tests/test_fangame_replay_v04.py'
      - 'tests/test_fangame_progression_feature_bridge.py'
      - 'tests/fixtures/fangame_nlzj3_feature_v02/**'
      - 'tests/fixtures/rpgmaker_graph_inference_v04.json'
      - '.github/workflows/fangame-feature-store.yml'
      - '.github/workflows/fangame-feature-store-test.yml'
  workflow_dispatch:

jobs:
  feature-store-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema
      - name: Run v0.2 real-evidence regression
        run: python3 tests/test_fangame_feature_store.py
      - name: Run v0.3 graph bridge regression
        run: python3 tests/test_fangame_graph_feature_bridge.py
      - name: Run v0.4 graph inference regression
        run: python3 tests/test_fangame_graph_inference.py
      - name: Replay legacy real evidence through v0.4
        run: python3 tests/test_fangame_replay_v04.py
      - name: Run v0.5a progression Feature Store bridge regression
        run: python3 tests/test_fangame_progression_feature_bridge.py
