name: Fangame Content Inference Test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fangame_content_infer.py'
      - 'tests/test_fangame_content_infer.py'
      - '.github/workflows/fangame-content-infer-test.yml'
  workflow_dispatch:

jobs:
  test-content-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run tests
        run: python3 -m pytest -q tests/test_fangame_content_infer.py
