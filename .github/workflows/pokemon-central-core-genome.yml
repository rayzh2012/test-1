name: Pokémon Central Core Genome

on:
  workflow_dispatch:

jobs:
  genome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby

      - name: Run universal Genome pipeline
        run: |
          python3 tools/fangame_genome_runner.py \
            --target-json fangame_targets/pokemon_central_core.json \
            --outdir out/pokemon-central-core \
            --workdir work/pokemon-central-core \
            --skip-perceptual

      - name: Preserve package identity evidence only
        if: always()
        run: |
          mkdir -p out/pokemon-central-core
          cp work/pokemon-central-core/fetch/fetch_report.json out/pokemon-central-core/fetch_report.json 2>/dev/null || true
          cp work/pokemon-central-core/fetch/SHA256.txt out/pokemon-central-core/SHA256.txt 2>/dev/null || true

      - name: Summarize result
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('out/pokemon-central-core')
          for name in ('genome_summary.json','normalized_profile.json','public_report.json','playability_static.json','fetch_report.json'):
              p=root/name
              if not p.exists():
                  continue
              data=json.load(open(p,encoding='utf-8'))
              if name=='genome_summary.json':
                  keys=('engine','content_visibility','maps','dialogue_chars','battle_calls','choices','public_report_status')
                  print(name, {k:data.get(k) for k in keys})
              elif name=='normalized_profile.json':
                  print(name, {'title':data.get('title'),'engine':data.get('engine'),'metrics':data.get('metrics'),'progression':data.get('progression')})
              elif name=='fetch_report.json':
                  print(name, {'success':data.get('success'),'file':data.get('file'),'bytes':data.get('bytes'),'sha256':data.get('sha256')})
              else:
                  print(name, 'present')
          PY

      - name: Upload metrics and reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-central-core-genome-metrics
          path: out/pokemon-central-core/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
