name: Fangame Fetcher
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch verified Magic Baby Memorial package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --connect-timeout 20 --max-time 900 \
            -A 'Mozilla/5.0' \
            -o out/mlbbhjdjb.rar \
            'https://99dj.197784.com/9dj2/mlbbhjdjb.rar'
          test $(stat -c%s out/mlbbhjdjb.rar) -gt 50000000
          sha256sum out/mlbbhjdjb.rar | tee out/SHA256.txt
          file out/mlbbhjdjb.rar
          split -b 80M -d -a 2 out/mlbbhjdjb.rar out/mlbbhjdjb.rar.part
          cat > out/README_合并.txt <<'EOF'
          魔力宝贝纪念版 2012 全剧情版
          将三个分卷放在同一目录后合并：
          macOS/Linux: cat mlbbhjdjb.rar.part00 mlbbhjdjb.rar.part01 mlbbhjdjb.rar.part02 > mlbbhjdjb.rar
          Windows CMD: copy /b mlbbhjdjb.rar.part00+mlbbhjdjb.rar.part01+mlbbhjdjb.rar.part02 mlbbhjdjb.rar
          完整RAR SHA256: 683190cf5ae8f1bd746691cdc0c3c6828b28128bc7cd6e0d63a5961e1456c1c4
          EOF
          rm out/mlbbhjdjb.rar
          ls -lah out
      - name: Upload part00
        uses: actions/upload-artifact@v4
        with:
          name: mlbbhjdjb-rar-part00
          path: out/mlbbhjdjb.rar.part00
          compression-level: 0
          retention-days: 7
      - name: Upload part01
        uses: actions/upload-artifact@v4
        with:
          name: mlbbhjdjb-rar-part01
          path: out/mlbbhjdjb.rar.part01
          compression-level: 0
          retention-days: 7
      - name: Upload part02
        uses: actions/upload-artifact@v4
        with:
          name: mlbbhjdjb-rar-part02
          path: out/mlbbhjdjb.rar.part02
          compression-level: 0
          retention-days: 7
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: mlbbhjdjb-metadata
          path: |
            out/SHA256.txt
            out/README_合并.txt
          retention-days: 7
