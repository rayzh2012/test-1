name: Fangame Fetcher
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and split 梦幻群侠传1 immediately
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/parts
          python3 tools/fangame_fetcher.py fangame_targets/menghuan_qunxiazhuan1_live962.json -o out
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('out/fetch_report.json'))['file'])
          PY
          )
          cp out/SHA256.txt out/parts/
          cp out/fetch_report.json out/parts/
          split -b 75M -d -a 3 "out/$game" "out/parts/$game.part"
          printf '%s\n' "$game" > out/parts/ORIGINAL_FILENAME.txt
          rm "out/$game"
          ls -lah out/parts
      - name: Upload part000
        if: hashFiles('out/parts/*.part000') != ''
        uses: actions/upload-artifact@v4
        with: {name: 'menghuan1-fast-part000', path: 'out/parts/*.part000', retention-days: 7, compression-level: 0}
      - name: Upload part001
        if: hashFiles('out/parts/*.part001') != ''
        uses: actions/upload-artifact@v4
        with: {name: 'menghuan1-fast-part001', path: 'out/parts/*.part001', retention-days: 7, compression-level: 0}
      - name: Upload part002
        if: hashFiles('out/parts/*.part002') != ''
        uses: actions/upload-artifact@v4
        with: {name: 'menghuan1-fast-part002', path: 'out/parts/*.part002', retention-days: 7, compression-level: 0}
      - name: Upload part003
        if: hashFiles('out/parts/*.part003') != ''
        uses: actions/upload-artifact@v4
        with: {name: 'menghuan1-fast-part003', path: 'out/parts/*.part003', retention-days: 7, compression-level: 0}
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: menghuan1-fast-metadata
          path: |
            out/parts/SHA256.txt
            out/parts/fetch_report.json
            out/parts/ORIGINAL_FILENAME.txt
          retention-days: 7
