name: CNG Museum PDF Browser Fetch

on:
  push:
    paths:
      - '.github/workflows/cng-browser-pdf-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser client
        run: pip install -q selenium requests
      - name: Resolve JS challenge and fetch official PDF
        shell: python
        run: |
          import os, time, requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url = 'https://www.chnmuseum.cn/yj/xscg/xslw/202204/W020220419559021749858.pdf'
          os.makedirs('downloads', exist_ok=True)

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1280,900')
          opts.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36')

          driver = webdriver.Chrome(options=opts)
          try:
              driver.get(url)
              time.sleep(8)
              current = driver.current_url
              cookies = {c['name']: c['value'] for c in driver.get_cookies()}
              ua = driver.execute_script('return navigator.userAgent')
              print('current_url=', current)
              print('cookies=', list(cookies))
              print('title=', driver.title)

              s = requests.Session()
              s.cookies.update(cookies)
              headers = {
                  'User-Agent': ua,
                  'Referer': 'https://www.chnmuseum.cn/yj/xscg/xslw/202204/t20220419_256129.shtml',
                  'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8'
              }
              r = s.get(url, headers=headers, timeout=120, allow_redirects=True)
              print('status=', r.status_code, 'type=', r.headers.get('content-type'), 'bytes=', len(r.content))
              out = 'downloads/Dai_Xiangming_Xia_Culture_Xia_Dynasty_OFFICIAL.pdf'
              if r.content.startswith(b'%PDF-'):
                  open(out,'wb').write(r.content)
                  print('PDF_OK', out)
              else:
                  open('downloads/response.html','wb').write(r.content)
                  raise SystemExit('Did not receive PDF after browser challenge')
          finally:
              driver.quit()

      - name: Verify
        run: |
          file downloads/* || true
          ls -lh downloads
          pdfinfo downloads/*.pdf | head -30

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cng-xia-official-pdf
          path: downloads/
          compression-level: 0
          retention-days: 7
