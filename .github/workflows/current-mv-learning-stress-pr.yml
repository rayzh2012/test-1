name: Current MV Learning Stress PR

on:
  pull_request:
    branches:
      - fangame-rescue-pokemon-unchosen-v1510-20260822
    paths:
      - '.github/workflows/current-mv-learning-stress-pr.yml'
      - 'fangame_longrun/learning_stress.json'
      - 'fangame_targets/final_redemption_mv.json'
      - 'tools/fangame_mv_learning_longrun_probe.py'
      - 'tools/fangame_mv_survival_learning_probe.py'
      - 'tools/fangame_mv_survival_learning_probe_v2.py'
      - 'tools/fangame_mv_survival_learning_probe_v3_playlog.py'
      - 'tools/fangame_mv_survival_learning_probe_v4.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Enforce zero-cost v4 stress contract and compile
        id: cfg
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('fangame_longrun/learning_stress.json',encoding='utf-8'))
          assert c['runner']=='ubuntu-latest'
          assert c['paid_larger_runner'] is False
          assert c['external_ai_api'] is False
          assert c['local_llm'] is False
          assert int(c['duration_minutes'])==15
          assert int(c['max_duration_minutes'])==15
          print('target='+c['target'])
          print('game_id='+c['game_id'])
          PY
          python3 -m py_compile tools/fangame_mv_learning_longrun_probe.py tools/fangame_mv_survival_learning_probe.py tools/fangame_mv_survival_learning_probe_v2.py tools/fangame_mv_survival_learning_probe_v3_playlog.py tools/fangame_mv_survival_learning_probe_v4.py

      - name: Fetch exact current public package
        shell: bash
        run: |
          rm -rf learning_fetch learning_work learning_out
          mkdir -p learning_fetch learning_work learning_out
          python3 tools/fangame_fetcher.py '${{ steps.cfg.outputs.target }}' -o learning_fetch

      - name: Verify exact package identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('fangame_longrun/learning_stress.json',encoding='utf-8'))
          r=json.load(open('learning_fetch/fetch_report.json',encoding='utf-8'))
          w=c['package_identity']
          assert r['bytes']==w['bytes'], (r['bytes'],w['bytes'])
          assert r['sha256'].lower()==w['sha256'].lower(), (r['sha256'],w['sha256'])
          print('PACKAGE_IDENTITY_VERIFIED')
          PY

      - name: Install free runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar libarchive-tools ruby
          python3 -m pip install --disable-pip-version-check requests playwright
          (google-chrome --version || google-chrome-stable --version || chromium --version)

      - name: Extract and inspect
        shell: bash
        run: |
          game=$(python3 - <<'PY'
          import json
          print(json.load(open('learning_fetch/fetch_report.json',encoding='utf-8'))['file'])
          PY
          )
          python3 tools/fangame_inspect.py "learning_fetch/$game" --workdir learning_work --out learning_out/playability_static.json

      - name: Run fifteen-minute v4 survival-route stress gate
        shell: bash
        run: |
          set +e
          python3 tools/fangame_mv_survival_learning_probe_v4.py \
            --static learning_out/playability_static.json \
            --extract-root learning_work/extract \
            --config fangame_longrun/learning_stress.json \
            --outdir learning_out/learning
          rc=$?
          echo "probe_rc=$rc"
          exit 0

      - name: Enforce v4 survival and novelty result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('learning_out/learning')
          p=out/'mv_learning_summary.json'
          tr=out/'mv_learning_trace.jsonl'
          if not p.exists(): raise SystemExit('NO_LEARNING_SUMMARY')
          r=json.load(p.open(encoding='utf-8'))
          c=json.load(open('fangame_longrun/learning_stress.json',encoding='utf-8'))
          gate=c['stress_pass_contract']; rows=[]
          if tr.exists():
            for line in tr.open(encoding='utf-8'):
              try: rows.append(json.loads(line))
              except Exception: pass
          seen=set(); newpos=[]; transitions=[]; prev=None
          for q in rows:
            s=q.get('state') or {}; pl=s.get('player') or {}; mid=s.get('map_id'); t=float(q.get('t',0) or 0)
            pos=(mid,pl.get('x'),pl.get('y')) if mid is not None and pl.get('x') is not None and pl.get('y') is not None else None
            if pos and pos not in seen: seen.add(pos); newpos.append((t,pos))
            if pos and prev and pos[0]!=prev[0]: transitions.append((t,prev[0],pos[0]))
            if pos: prev=pos
          elapsed=float(r.get('elapsed_play_seconds',0) or 0); last_new=newpos[-1][0] if newpos else 0.0
          reversals=sum(1 for i in range(1,len(transitions)) if transitions[i-1][1]==transitions[i][2] and transitions[i-1][2]==transitions[i][1])
          pingpong=(reversals/max(1,len(transitions)-1)) if len(transitions)>1 else 0.0
          evidence={
            'status':r.get('status'),'elapsed_play_seconds':elapsed,'deaths':r.get('deaths'),
            'checkpoint_recoveries':r.get('checkpoint_recoveries'),'checkpoint_failures':r.get('checkpoint_failures'),
            'full_restarts':r.get('full_restarts'),'unique_map_count':r.get('unique_map_count'),
            'unique_position_count':r.get('unique_position_count'),'map_transitions':r.get('map_transitions'),
            'battle_starts':r.get('battle_starts'),'battle_completions':r.get('battle_completions'),
            'last_new_position_second':round(last_new,3),'seconds_since_last_new_position':round(elapsed-last_new,3),
            'reverse_pingpong_ratio':round(pingpong,4),'route_progress_verified':r.get('route_progress_verified'),
            'fatal_stop':r.get('fatal_stop')}
          print(json.dumps(evidence,indent=2))
          json.dump(evidence,open(out/'v4_gate_metrics.json','w',encoding='utf-8'),indent=2)
          assert elapsed >= float(gate['min_elapsed_play_seconds']), 'STRESS_DURATION_NOT_REACHED'
          assert r.get('route_progress_verified') is True, 'NO_ROUTE_PROGRESS'
          assert int(r.get('battle_starts',0) or 0) >= int(gate['min_battle_starts']), 'INSUFFICIENT_BATTLE_EXPOSURE'
          assert int(r.get('unique_map_count',0) or 0) >= int(gate['min_unique_maps']), 'INSUFFICIENT_MAP_NOVELTY'
          assert elapsed-last_new <= float(gate['max_seconds_since_last_new_position']), 'LATE_ROUTE_STAGNATION'
          if len(transitions)>7: assert pingpong <= float(gate['max_reverse_pingpong_ratio']), 'TRANSFER_PINGPONG_TOO_HIGH'
          assert not r.get('fatal_stop'), r.get('fatal_stop')
          deaths=int(r.get('deaths',0) or 0); recovered=int(r.get('checkpoint_recoveries',0) or 0)+int(r.get('full_restarts',0) or 0)
          assert deaths <= int(gate['max_deaths']), ('TOO_MANY_DEATHS',deaths)
          assert recovered >= deaths, ('UNRECOVERED_DEATHS',deaths,recovered)
          if deaths: assert r.get('death_learning_exercised') is True, 'DEATH_LEARNING_NOT_EXERCISED'
          PY

      - name: Upload v4 stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-learning-stress-final-redemption-v4-15m
          path: |
            learning_fetch/fetch_report.json
            learning_fetch/SHA256.txt
            learning_out/playability_static.json
            learning_out/learning/mv_learning_summary.json
            learning_out/learning/mv_learning_trace.jsonl
            learning_out/learning/mv_learning_guide.json
            learning_out/learning/mv_learning_guide.md
            learning_out/learning/mv_human_play_log.jsonl
            learning_out/learning/mv_human_play_log.md
            learning_out/learning/v4_gate_metrics.json
            learning_out/learning/*.png
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
